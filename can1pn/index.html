<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>K-Home Avenue 1PN</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
    }

    #app,
    html,
    body {
      padding: 0;
      margin: 0;
      background: #eeeeee;
    }

    /* Hide the OS cursor over the 360 panorama canvas so only the in-scene floor
       cursor (hotspot_mouse plane.png) and the directional arrow
       (hotspot_mouse_arrow svg) are visible. Pointer events still
       reach krpano normally. */
    #pano canvas {
      cursor: none !important;
    }

    /* Ensure OS cursor is properly visible on UI panels and popups */
    .m3d_panel,
    .m3d_panel * {
      cursor: default;
    }
    .m3d_panel .m3d_btn,
    .m3d_panel .m3d_seg {
      cursor: pointer !important;
    }
    .m3d_panel .m3d_header {
      cursor: move !important;
    }

    img,
    div {
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    .el-tooltip__popper.is-dark {
      background: rgba(0, 0, 0, 0.5);
    }

    .el-tooltip__popper[x-placement^="top"] .popper__arrow {
      border-top-color: rgba(0, 0, 0, 0.5);
    }

    .el-tooltip__popper[x-placement^="top"] .popper__arrow::after {
      border-top-color: rgba(0, 0, 0, 0.5);
    }

    .el-image-viewer__mask {
      opacity: 0.8;
    }

    *::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }

    *::-webkit-scrollbar-button {
      width: 0;
      height: 0;
    }

    *::-webkit-scrollbar-thumb {
      background-color: transparent;
      border-radius: 2px;
    }

    *:hover::-webkit-scrollbar-thumb {
      background-color: #bbc1c4;
    }

    #pano {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      overflow: hidden;
    }

    .hint {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .mark {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      color: rgba(255, 255, 255, 0.5);
      font-size: 14px;
      pointer-events: none;
      z-index: 0;
    }

    .mobile_mark {
      font-size: 10px;
    }

    .advertisement {
      width: 50%;
      position: fixed;
      top: 50px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9;
    }

    .mobile {
      width: 70%;
    }

    .advertisement-img {
      width: 100%;
      cursor: pointer;
    }

    .advertisement-close {
      width: 20px;
      position: absolute;
      top: -8px;
      right: -8px;
      cursor: pointer;
    }

    .advertisement-hint {
      position: absolute;
      bottom: 5px;
      right: 0;
      font-size: 14px;
      color: rgba(0, 0, 0, 0.5);
      color: #ffffff;
      padding: 0 5px;
    }

    /* Mini map (sandtable) size + padding */
    .sand-table-dialog {
      width: 166px !important;
      height: 355px !important;
      padding: 0 !important;
      /* bỏ khoảng cách để ảnh full khung */
      box-sizing: border-box;
      position: relative;
      /* để map-container absolute bám theo */
      overflow: hidden;
    }

    .sand-table-dialog .point {
      width: 12px !important;
      height: 12px !important;
    }

    .sand-table-dialog img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      /* cho ảnh lấp đầy khung */
      margin: 0;
    }

    /* Ẩn hẳn các element sandtable cũ/krpano mini bên trong dialog */
    .sand-table-dialog #map-container-3d,
    .sand-table-dialog #krpanoSWFObject2 {
      display: none !important;
    }

    /* Ẩn thanh menu đáy */
    .jy-bottom-menu {
      display: none !important;
    }

    /* Ẩn icon cụ thể trong jy-right-menu (base64 hình bạn gửi) */
    .jy-right-menu img[src^="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEgAAABICAYAAABV7bNHAAAAAXNSR0IArs4c6QAADRJJREFUeF7tXHtcTGk"] {
      display: none !important;
    }

    /* Ẩn label tên scene ở góc phải */
    .jy-right-nameDisplay {
      display: none !important;
    }

    /* Ẩn toàn bộ cụm icon top bên phải (rotate + map, v.v.) */
    .jy-right-menu-top {
      display: none !important;
    }

    /* Ẩn tất cả thumbnail scene ở thanh dưới, chỉ chừa slide Dollhouse (minimap) */
    .jy-bottom-sence-swiper .swiper-slide {
      display: none !important;
    }

    .jy-bottom-sence-swiper {
      display: none !important;
    }

    .jy-bottom-sence-swiper .swiper-slide:last-child {
      display: block !important;
    }

    /* Đưa nút Dollhouse (thanh dưới) về bên trái */
    .jy-bottom-container.center-layout {
      justify-content: flex-start !important;
      display: none !important;
    }

    .jy-bottom-sence-swiper {
      width: 100% !important;
      margin-left: 0 !important;
      margin-right: auto !important;
    }

    .jy-bottom-sence-swiper .swiper-wrapper {
      display: flex !important;
      justify-content: flex-start !important;
      transform: translate3d(0, 0, 0) !important;
      margin-left: 0 !important;
    }

    .jy-bottom-group-scene-wrap {
      /* background-color: #ffffff; */
      display: flex !important;
    }

    .jy-bottom-group-item {
      background: #34513C !important;
      color: #F5DEA4 !important;
    }



    /* Đặt vị trí minimap (sand-table) sát góc phải, right = 44px */
    .jy-right-menu .sand-table-dialog[data-v-a18bd81c] {
      box-sizing: border-box;
      padding: 10px;
      position: absolute;
      top: 50px;
      right: 44px !important;
      background: rgba(26, 27, 34, 0.4);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Disable scrolling marquee on group name buttons */
    .jy-bottom-group-item p.scroll {
      animation: none !important;
    }

    @media (max-width: 768px) {
      /* .jy-bottom-container {
        bottom: 10px !important;
      } */

      .jy-bottom-container .jy-bottom-group-swiper[data-v-4115171d] {

        position: fixed !important;
        right: 20px !important;
        /* top: 96.5% !important; */
        bottom: 2px !important;
      }


    }
  </style>
</head>

<body>
  <script>
    if (typeof require === "undefined") {
      window.require = function (name) {
        if (name === "Vue" || name === "vue") return window.Vue;
        throw new Error(
          "require shim only supports Vue in this environment: " + name,
        );
      };
    }
  </script>
  <script src="index.js"></script>

  <div id="app">
    <div id="pano"></div>
  </div>
  <script>
    var data = null;
    window.jydata = data;
    window.onload = function () {
      var xhr = new XMLHttpRequest();
      xhr.open("GET", "project.json", true);
      xhr.onload = function (res) {
        data = xhr.responseText;
        window.jydata = JSON.parse(data);
        if (typeof window.applyLocaleGroups === "function") {
          window.applyLocaleGroups();
        }
        window.JyCom();
        setTimeout(() => {
          embedpano({
            xml: window.jydata.xml,
            bgcolor: window.jydata.base.icon.moduleList[5].defaultColor,
            target: "pano",
            html5: "only",
            mobilescale: 1.0,
            onready: function (jsapi) {
              window.krpano = jsapi.get("global");
              window.krpano.actions.includexml(
                "plugins/jy-config/config.xml",
                function () {
                  window.implantInterval = [];
                  window.implantIntervalLook = [];
                  window.krpano.call("add_shade()");
                  if (!window.krpano.device.mobile) {
                    window.krpano.call("draghotspot()");
                    window.krpano.call("add_mouse_pos()");
                    window.krpano.call("add_mouse_arrow()");
                  }
                  window.krpano.call("showFlootHotspot()");
                },
              );
            },
          });
        }, 500);
      };
      xhr.send(null);
    };
  </script>
  <script>
    window.applyLocaleGroups = function () {
      if (!window.jydata || !window.jydata.groups) return;
      var locale = localStorage.getItem("locale") || "vi";
      var isEn = locale === "en";
      window.jydata.groups.forEach(function (group) {
        if (!group.name_vi) group.name_vi = group.name;
        group.name = isEn && group.name_en ? group.name_en : group.name_vi;
        if (group.childGroups) {
          group.childGroups.forEach(function (child) {
            if (!child.name_vi) child.name_vi = child.name;
            child.name = isEn && child.name_en ? child.name_en : child.name_vi;
          });
        }
      });
    };

    window.applyLocaleHotspots = function () {
      if (!window.krpano) return;
      setTimeout(function () {
        try {
          var currentScene = window.krpano.get("xml.scene");
          if (currentScene !== "scene_010") return;

          var locale = localStorage.getItem("locale") || "vi";
          var isEn = locale === "en";
          var viShow = isEn ? "false" : "true";
          var enShow = isEn ? "true" : "false";

          var viHotspots = ["hs_info1", "hs_info2", "hs_info3"];
          var enHotspots = ["hs_info1_en", "hs_info2_en", "hs_info3_en"];

          viHotspots.forEach(function (name) {
            if (window.krpano.get("hotspot[" + name + "].name")) {
              window.krpano.call("set(hotspot[" + name + "].visible," + viShow + ")");
            }
          });
          enHotspots.forEach(function (name) {
            if (window.krpano.get("hotspot[" + name + "].name")) {
              window.krpano.call("set(hotspot[" + name + "].visible," + enShow + ")");
            }
          });
        } catch (e) { }
      }, 200);
    };
  </script>
  <script src="plugins/standalone_map.js"></script>
</body>

</html>
